services:
  # Backend Express.js + Prisma service
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    volumes:
      - wa_sessions:/app/sessions
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network
    read_only: true
    tmpfs:
      - /tmp/app:exec,nosuid,size=100m,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # MySQL Database
  mysql:
    image: mysql:8.0.40
    container_name: mysql-database
    ports:
      - "3307:3306"
    env_file:
      - .env.docker
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    container_name: phpmyadmin
    ports:
      - "8080:80"
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true

  # Redis Cache
  redis:
    image: redis:7.4-alpine3.20
    container_name: redis-database
    ports:
      - "6379:6379"
    env_file:
      - .env.docker
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true

  # Redis Insight
  redis-insight:
    image: redis/redisinsight:2.58.0
    container_name: redis-admin
    ports:
      - "8081:5540"
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true

# Named volumes for data persistence
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  wa_sessions:
    driver: local

# User-defined network
networks:
  app-network:
    driver: bridge