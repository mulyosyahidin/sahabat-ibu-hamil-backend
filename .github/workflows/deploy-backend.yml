name: Deploy Backend to VPS

on:
  push:
    branches:
      - development

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sahabat-ibu-hamil-backend:latest
            ghcr.io/${{ github.repository_owner }}/sahabat-ibu-hamil-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build_and_push
    
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/id_rsa ${{ vars.USERNAME }}@${{ vars.HOST }} << 'EOF'
            set -e
            
            echo "🚀 Starting deployment process..."
            cd ${{ vars.APP_PATH }}

            echo "🔐 Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || { echo "GHCR login failed"; exit 1; }

            echo "📥 Pulling new Docker image..."
            docker pull ghcr.io/${{ github.repository_owner }}/sahabat-ibu-hamil-backend:latest || { echo "Docker pull failed"; exit 1; }

            echo "🏷️ Tagging image for local use..."
            docker tag ghcr.io/${{ github.repository_owner }}/sahabat-ibu-hamil-backend:latest sahabat-ibu-hamil-backend:latest

            echo "🛑 Stopping existing containers..."
            docker compose down || echo "No containers running, skipping shutdown."

            echo "🗑️ Cleaning up old images..."
            docker image prune -f || echo "No images to clean up."

            echo "🚀 Starting new containers..."
            docker compose up -d || { echo "Docker compose up failed"; exit 1; }

            echo "🎉 Deployment completed successfully!"
            
            # Show container status
            echo "📊 Container status:"
            docker compose ps
          EOF

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

      - name: Deployment Status
        run: |
          echo "✅ Backend deployment to ${{ vars.HOST }} completed!"
          echo "📍 Deployed from: ${{ github.ref_name }} branch"
          echo "📝 Commit: ${{ github.sha }}"
          echo "🐳 Image: ghcr.io/${{ github.repository_owner }}/sahabat-ibu-hamil-backend:latest"