name: Deploy Backend to Server

# Trigger workflow saat ada push ke branch development
on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup SSH
        run: |
          # Buat direktori .ssh dan set permission
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Simpan private key SSH ke file
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Tambahkan server ke known_hosts untuk menghindari prompt
          ssh-keyscan -H ${{ vars.HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ vars.USERNAME }}@${{ vars.HOST }} << 'EOF'
            set -e
            
            echo "🚀 Starting deployment process..."
            
            # Cek apakah direktori APP_PATH sudah ada
            if [ ! -d "${{ vars.APP_PATH }}" ]; then
              echo "📁 Directory tidak ditemukan, membuat direktori dan clone repository..."
              mkdir -p ${{ vars.APP_PATH }}
              cd ${{ vars.APP_PATH }}
              git clone ${{ github.server_url }}/${{ github.repository }} .
            else
              echo "📁 Directory sudah ada, melakukan git pull..."
              cd ${{ vars.APP_PATH }}
              
              # Pastikan kita di branch yang benar
              git fetch origin
              git checkout development
              git pull origin development
            fi
            
            echo "🐳 Stopping existing containers..."
            docker compose down || true
            
            echo "🔨 Building and starting containers..."
            docker compose up -d --build
            
            echo "🎉 Deployment completed successfully!"
            
            # Tampilkan status containers
            echo "📊 Container status:"
            docker compose ps
          EOF
          
      - name: Cleanup SSH
        if: always()
        run: |
          # Hapus private key untuk keamanan
          rm -f ~/.ssh/id_rsa
          
      - name: Deployment Status
        run: |
          echo "✅ Backend deployment to ${{ vars.HOST }} completed!"
          echo "📍 Deployed from: ${{ github.ref_name }} branch"
          echo "📝 Commit: ${{ github.sha }}"